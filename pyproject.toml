[project]
name = "ai-agents"
version = "0.1.0"
description = "Multi-agent workflow builder for software teams."
readme = "README.md"
requires-python = ">=3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["src/packages/core", "src/packages/runtime", "src/packages/api"]

[dependency-groups]
dev = [
  "httpx2",
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.ruff]
target-version = "py313"
src = ["src/packages/core", "src/packages/runtime", "src/packages/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.13"
packages = ["agents_core", "agents_runtime", "agents_api"]

[tool.pytest.ini_options]
testpaths = ["src/packages"]
addopts = ["--import-mode=importlib"]
pythonpath = [
  "src/packages/core",
  "src/packages/runtime",
  "src/packages/api",
]
